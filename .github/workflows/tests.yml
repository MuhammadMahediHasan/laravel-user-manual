name: Tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'pint.json'
      - 'phpunit.xml.dist'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'pint.json'
      - 'phpunit.xml.dist'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
            pest: '3.*'
            pest-plugin: '3.*'
          - laravel: '12.*'
            testbench: '10.*'
            pest: '3.*'
            pest-plugin: '3.*'
          - laravel: '13.*'
            testbench: '11.*'
            pest: '4.*'
            pest-plugin: '4.*'
        exclude:
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest-plugin }}" --dev --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/pest
